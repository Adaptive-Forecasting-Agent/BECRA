# Conda env for BECRA (GPU training + LLM API for stages 2–4).
# Create:  conda env create -f environment.yml
# Or use scripts/activate_becra.sh after: conda create -n becra python=3.10 -y
name: becra
channels:
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      - numpy>=1.24
      - pandas>=2.0
      - scipy>=1.10
      - scikit-learn>=1.3
      - statsmodels>=0.14
      - einops>=0.7
      - requests>=2.31
      - PyYAML>=6.0
      - datasets>=2.18
      - huggingface_hub>=0.20
      - matplotlib>=3.7
# RTX 5090 (sm_120) needs cu128, not cu124:
#   export TMPDIR=/home/user/tmp PIP_CACHE_DIR=/home/user/.pip-cache
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu128
