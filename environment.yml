# Conda environment for BECRA.
# Create:  conda env create -f environment.yml
# Then install a PyTorch build that matches your CUDA version (https://pytorch.org).
name: becra
channels:
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      - numpy>=1.24
      - pandas>=2.0
      - scipy>=1.10
      - scikit-learn>=1.3
      - statsmodels>=0.14
      - EMD-signal>=1.5
      - einops>=0.7
      - requests>=2.31
      - PyYAML>=6.0
      - matplotlib>=3.7
      - datasets>=2.18
      - huggingface_hub>=0.20
